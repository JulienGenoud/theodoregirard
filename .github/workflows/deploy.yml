name: Déploiement GitHub Pages

# Chaque push sur main reconstruit le site (pré-rendu inclus) et le publie
# sur la branche gh-pages, servie sur https://www.theodoregirard.fr.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Publication sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.theodoregirard.fr
          commit_message: 'deploy: ${{ github.sha }}'
